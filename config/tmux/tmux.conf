# ============================================================================
# tmux Configuration - Dotfiles v1.0.0
# Purpose: Terminal multiplexer configuration (migrated from Zellij)
# Theme: Dracula (consistent with Wezterm & Neovim)
# Keybinding Philosophy: Ctrl+q prefix (ergonomic, non-conflicting)
# ============================================================================

# ============================================================================
# Prefix Key
# ============================================================================
# Ctrl+q: Ergonomic, doesn't conflict with common tools
#   - Ctrl+a: Reserved for shell (jump to line start)
#   - Ctrl+b: Common in Vim/Emacs (backward char)
#   - Ctrl+q: Used by some editors (cancel/escape)
unbind C-b
set -g prefix C-q
bind C-q send-prefix

# ============================================================================
# General Settings
# ============================================================================

# Default shell
set -g default-shell /opt/homebrew/bin/fish
set -g default-command "/opt/homebrew/bin/fish -l"

# True color support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Extended keys (CSI u) - pass through Shift+Enter etc. to applications
# "always" = send CSI u to inner apps unconditionally (needed for Claude Code
# which doesn't negotiate extended-keys mode but needs Shift+Enter detection)
set -s extended-keys always
set -as terminal-features 'xterm*:extkeys'

# History
set -g history-limit 10000

# Mouse support
set -g mouse on

# 1-indexed windows/panes (matches Zellij tab 1-9)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Reduce escape delay (faster response in Vim/Neovim)
set -sg escape-time 0

# Focus events (for Neovim autoread)
set -g focus-events on

# Don't exit tmux when last session is destroyed
set -g detach-on-destroy off

# ============================================================================
# Clipboard (macOS)
# ============================================================================
set -g set-clipboard on
setw -g mode-keys vi

# Vi copy mode
bind [ copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# Scroll mode vi keys
bind -T copy-mode-vi j send -X cursor-down
bind -T copy-mode-vi k send -X cursor-up
bind -T copy-mode-vi C-f send -X page-down
bind -T copy-mode-vi C-b send -X page-up
bind -T copy-mode-vi d send -X halfpage-down
bind -T copy-mode-vi u send -X halfpage-up

# ============================================================================
# Pane Navigation (Vim-style)
# ============================================================================
# vim-tmux-navigator handles Ctrl+h/j/k/l for Neovim integration
# prefix + h/j/k/l as fallback
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind Left select-pane -L
bind Down select-pane -D
bind Up select-pane -U
bind Right select-pane -R

# ============================================================================
# Splitting
# ============================================================================
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# ============================================================================
# Pane Management
# ============================================================================
bind c new-window -c "#{pane_current_path}"
bind x confirm-before -p "kill pane? (y/n)" kill-pane
bind z resize-pane -Z

# ============================================================================
# Resize Mode
# ============================================================================
# prefix + r enters resize key table, then use h/j/k/l repeatedly
bind r switch-client -T resize
bind -T resize h resize-pane -L 3 \; switch-client -T resize
bind -T resize j resize-pane -D 3 \; switch-client -T resize
bind -T resize k resize-pane -U 3 \; switch-client -T resize
bind -T resize l resize-pane -R 3 \; switch-client -T resize
bind -T resize H resize-pane -L 1 \; switch-client -T resize
bind -T resize J resize-pane -D 1 \; switch-client -T resize
bind -T resize K resize-pane -U 1 \; switch-client -T resize
bind -T resize L resize-pane -R 1 \; switch-client -T resize
bind -T resize Escape switch-client -Troot

# ============================================================================
# Tab/Window Management
# ============================================================================
bind t new-window -c "#{pane_current_path}"
bind , command-prompt -I "#W" "rename-window '%%'"
bind 1 select-window -t 1
bind 2 select-window -t 2
bind 3 select-window -t 3
bind 4 select-window -t 4
bind 5 select-window -t 5
bind 6 select-window -t 6
bind 7 select-window -t 7
bind 8 select-window -t 8
bind 9 select-window -t 9

# Tab movement (match Zellij defaults)
bind -n M-i swap-window -t -1 \; select-window -t -1
bind -n M-o swap-window -t +1 \; select-window -t +1

# ============================================================================
# Session Management
# ============================================================================
bind d detach-client
bind w choose-tree -Zs

# ============================================================================
# Claude Code Integration (devaslife-style popup)
# ============================================================================
# Ctrl+q + g : Toggle Claude Code popup (persistent session per directory)
#   - Creates a separate tmux session named "claude-<hash>" per working directory
#   - Closing the popup keeps the session alive in background
#   - Reopening attaches to the same session (conversation continues)
bind g run-shell '\
  SESSION="claude-$(echo #{pane_current_path} | md5 | cut -c1-8)"; \
  tmux has-session -t "$SESSION" 2>/dev/null || \
  tmux new-session -d -s "$SESSION" -c "#{pane_current_path}" "claude"; \
  tmux display-popup -w 80% -h 80% -E "tmux attach-session -t $SESSION"'

# ============================================================================
# Status Bar / Bell
# ============================================================================
# Status bar at top (tab-like appearance)
set -g status-position top

# Disable visual/audible bell
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# ============================================================================
# TPM Plugins
# ============================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'dracula/tmux'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'b0o/tmux-autoreload'
set -g @plugin 'timvw/tmux-assistant-resurrect'

# ============================================================================
# Dracula Theme Configuration
# ============================================================================
set -g @dracula-show-powerline true
set -g @dracula-plugins "cpu-usage ram-usage time"
set -g @dracula-show-left-icon session
set -g @dracula-show-flags true
set -g @dracula-day-month true
set -g @dracula-military-time true

# ============================================================================
# Session Persistence (tmux-resurrect + tmux-continuum)
# ============================================================================
# SECURITY: Don't capture pane contents (prevents sensitive data leakage)
set -g @resurrect-capture-pane-contents 'off'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-strategy-nvim 'session'

# ============================================================================
# Config Reload (manual fallback — tmux-autoreload handles this automatically)
# ============================================================================
bind R source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# ============================================================================
# Initialize TPM (MUST be last line)
# ============================================================================
run '~/.tmux/plugins/tpm/tpm'

# ============================================================================
# Quick Reference
# ============================================================================
#
# Primary Prefix: Ctrl+q
#
# Pane Management:
#   Ctrl+q + c       : Create new window
#   Ctrl+q + x       : Close current pane
#   Ctrl+q + z       : Toggle pane fullscreen
#   Ctrl+q + |       : Split right
#   Ctrl+q + -       : Split down
#
# Navigation:
#   Ctrl+q + h/j/k/l : Navigate panes (Vim-style)
#   Ctrl+q + arrows  : Navigate panes (Arrow keys)
#   Ctrl+h/j/k/l     : Navigate across Neovim/tmux (vim-tmux-navigator)
#
# Modes:
#   Ctrl+q + [       : Copy/scroll mode (vi keys)
#   Ctrl+q + r       : Resize mode (h/j/k/l to resize, Esc to exit)
#   Ctrl+q + w       : Session/window browser
#
# Windows/Tabs:
#   Ctrl+q + t       : New window
#   Ctrl+q + ,       : Rename window
#   Ctrl+q + 1-9     : Switch to window N
#   Alt+i / Alt+o    : Move window left/right
#
# Claude Code:
#   Ctrl+q + g       : Toggle Claude Code popup (persistent per directory)
#
# Session:
#   Ctrl+q + d       : Detach session
#   Ctrl+q + R       : Reload config (also auto-reloads via tmux-autoreload)
#
# Plugins:
#   Ctrl+q + I       : Install plugins (TPM)
#   Ctrl+q + U       : Update plugins (TPM)
#
# AI Session Persistence:
#   tmux-assistant-resurrect automatically saves/restores Claude Code sessions
#   on tmux restart (hooks into tmux-resurrect save/restore cycle)
#
# ============================================================================
